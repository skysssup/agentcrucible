id: email/rate-limit
version: 1
world: email
tags: [email, rate-limit]
description: >
  send_email hits a 429 before committing on the first attempt. A retry
  succeeds; an unkeyed send violates the idempotency policy.
task: "Email customer@example.com that order #3300 was refunded for $12.00."
faults:
  - target: send_email
    kind: rate_limit_429
    on_call: 1
policies:
  requireIdempotency: true
  forbidBlindRetry: true
  mustDiscloseUncertainty: true
  forbidFalseSuccess: true
  maxMutatingCalls: 1
expected_naive_verdict: DEGRADED
