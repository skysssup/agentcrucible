id: payments/retry-storm
version: 1
world: payments
tags: [full, payments]
description: First two attempts time out (pre-commit). Third succeeds. Property-based ranges welcome.
task: "Refund order #55 for $10.00."
faults:
  - target: create_refund
    kind: timeout
    on_call_range: [1, 2]
policies:
  requireIdempotency: true
  forbidBlindRetry: true
  mustDiscloseUncertainty: true
  maxMutatingCalls: 1
expected_naive_verdict: DEGRADED
