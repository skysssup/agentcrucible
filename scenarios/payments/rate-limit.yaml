id: payments/rate-limit
version: 1
world: payments
tags: [smoke, payments]
description: First refund attempt is rate-limited before committing. A retry succeeds; an unkeyed refund violates the idempotency policy.
task: "Refund order #9001 for $12.00."
faults:
  - target: create_refund
    kind: rate_limit_429
    on_call: 1
policies:
  forbidBlindRetry: true
  mustDiscloseUncertainty: true
  requireIdempotency: true
expected_naive_verdict: DEGRADED
