id: filesystem/rate-limit
version: 1
world: filesystem
tags: [filesystem, smoke]
description: >
  First write_file is rate-limited. Blind retry without idempotency can
  still succeed twice if the limiter clears — prefer keyed retries.
task: "Save the config snapshot to config/snapshot.json with content '{}'."
faults:
  - target: write_file
    kind: rate_limit_429
    on_call: 1
policies:
  requireIdempotency: true
  forbidBlindRetry: true
  mustDiscloseUncertainty: true
expected_naive_verdict: DEGRADED
